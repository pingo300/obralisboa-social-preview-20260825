<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obra Lisboa — Guias práticos</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff}header,main{max-width:960px;margin:auto;padding:32px 16px}header{padding-bottom:6px}.eyebrow{color:#cfff45;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.13em}h1{font-size:clamp(38px,8vw,72px);line-height:.9;letter-spacing:-.06em;margin:12px 0}.intro{color:#cfcfcf;line-height:1.5;max-width:600px}.guide{margin:34px 0 52px}.guide>h2{font-size:25px;margin:0 0 14px}.slides{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,76%);overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;padding-bottom:10px}.slide{scroll-snap-align:start;min-height:340px;background:#141414;border:1px solid #343434;padding:28px;display:flex;flex-direction:column;justify-content:space-between}.n{color:#cfff45;font-size:12px;font-weight:700;letter-spacing:.1em}.slide h3{font-size:31px;line-height:.95;letter-spacing:-.05em;margin:16px 0}.slide p{color:#ddd;font-size:17px;line-height:1.42}.note{font-size:13px;color:#aaa}</style></head><body><header><p class="eyebrow">Obra Lisboa · Guias práticos</p><h1>10 CARROSSÉIS</h1><p class="intro">Desliza cada sequência. Conteúdo educativo para ajudar a tomar decisões informadas antes e durante uma obra; não substitui avaliação técnica ou enquadramento municipal específico.</p></header><main id="guides"></main><script>
const guides=[
['ORÇAMENTO SEM SURPRESAS',['O que deve estar escrito?','Zonas, trabalhos, materiais, mão de obra, prazo e condições de pagamento.','Um valor sem âmbito definido não é comparável.','Peça o mesmo caderno de encargos a todas as propostas.','Clareza antes da adjudicação protege a obra.']],
['HUMIDADE: ENCONTRAR A CAUSA',['Mancha não é diagnóstico.','Condensação, infiltração e capilaridade pedem respostas diferentes.','Pintar por cima pode apenas esconder o problema.','Observe localização, época do ano e sinais junto a vãos ou pavimentos.','Resolver a origem vem antes do acabamento.']],
['CASA DE BANHO: O INVISÍVEL',['O que fica atrás do revestimento?','Impermeabilização, pendentes, escoamento, ventilação e acessos.','O “raio-X” ajuda a explicar a coordenação entre especialidades.','Valide antes de fechar paredes e pavimentos.','Rigor técnico é conforto para muitos anos.']],
['JANELAS E CONFORTO',['Não é só uma questão de estética.','O vão influencia temperatura, ruído, entrada de ar e luz.','Caixilharia, vidro e instalação devem ser pensados em conjunto.','Avalie a envolvente, exposição solar e necessidades reais.','Conforto é uma decisão de projeto.']],
['ANTES DE DEMOLIR',['Demolir começa por levantar.','Identifique elementos, infraestruturas e limitações existentes.','O que não foi verificado pode transformar-se em custo e atraso.','Coordene arquitetura, estrutura e especialidades antes de abrir.','Conhecer o existente permite decidir melhor.']],
['ELETRICIDADE PARA A ROTINA',['Tomadas onde são mesmo usadas.','Pense em mobiliário, equipamentos, iluminação de tarefa e futura flexibilidade.','Uma planta elétrica desenhada depois da obra gera remendos.','Valide os usos de cada divisão antes da execução.','A melhor instalação é a que funciona sem se notar.']],
['COZINHA QUE FUNCIONA',['A cozinha começa pelo uso.','Preparar, cozinhar, arrumar e limpar definem o desenho.','Portas e bancadas vêm depois do fluxo.','Meça equipamentos e confirme pontos técnicos cedo.','Uma boa cozinha simplifica todos os dias.']],
['OBRAS EM FRAÇÃO',['O que confirmar antes de começar?','A intervenção pode envolver regras de condomínio, município ou edifício.','Não existe uma resposta igual para todos os imóveis.','Confirme o enquadramento específico antes de adjudicar.','Planeamento também é cumprir regras.']],
['ESCOLHER A EQUIPA',['Preço não é o único critério.','Confirme experiência, responsável, âmbito, calendário e comunicação.','A qualificação e os títulos aplicáveis podem ser consultados.','Peça propostas comparáveis e registe decisões.','Uma boa equipa traz previsibilidade.']],
['ENTREGA DE OBRA',['O fim não é só a última demão.','Confirme trabalhos, acabamentos, documentação e pontos pendentes.','Registe o que fica por concluir antes do pagamento final.','Guarde faturas, garantias e contactos relevantes.','A entrega organizada protege o investimento.']]
];
document.querySelector('#guides').innerHTML=guides.map((g,i)=>'<section class="guide"><h2>'+String(i+1).padStart(2,'0')+' · '+g[0]+'</h2><div class="slides">'+g[1].map((s,j)=>'<article class="slide"><div class="n">'+String(j+1).padStart(2,'0')+' / 05</div><h3>'+s+'</h3><p>'+(['Capa e pergunta-chave.','Contexto para decidir.','Explicação técnica, em linguagem simples.','Ponto de validação.','Conclusão e próximo passo.'][j])+'</p></article>').join('')+'</div></section>').join('');
</script></body></html>
