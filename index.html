<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obra Lisboa — Pré-visualização</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #070707; color: #fff; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 720px); }
      p { color: #cfff45; font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin: 0 0 12px; }
      h1 { font-size: clamp(28px, 7vw, 52px); margin: 0 0 24px; line-height: 1; }
      img { display: block; width: 100%; border: 1px solid #ffffff; }
      footer { color: #a4a4a4; font-size: 14px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <p>Pré-visualização temporária</p>
      <h1>INSTALAÇÕES DE CASA DE BANHO</h1>
      <img src="exemplo-instalacoes-banho.png" alt="Esquema ilustrado de uma casa de banho e instalações" />
      <footer>Exemplo de formato educativo · Obra Lisboa</footer>
    </main>
  </body>
</html>
