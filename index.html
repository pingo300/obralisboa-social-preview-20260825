<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obra Lisboa — 30 publicações</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #070707; color: #fff; }
    header, main { max-width: 1440px; margin: auto; padding-left: 24px; padding-right: 24px; }
    header { padding-top: 48px; padding-bottom: 28px; }
    .eyebrow { color: #cfff45; font-size: 12px; font-weight: 700; letter-spacing: .14em; margin: 0 0 12px; text-transform: uppercase; }
    h1 { font-size: clamp(38px, 7vw, 76px); line-height: .94; margin: 0; letter-spacing: -.06em; }
    .intro { color: #cfcfcf; font-size: 17px; line-height: 1.5; max-width: 650px; margin: 22px 0 0; }
    .key { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .key span { border: 1px solid #404040; padding: 7px 10px; font-size: 12px; border-radius: 100px; }
    .key span:first-child { border-color: #cfff45; color: #cfff45; }
    main { padding-bottom: 56px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    article { background: #111; min-width: 0; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .meta { padding: 12px 13px 14px; }
    .number { color: #cfff45; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .type { color: #aaa; font-size: 13px; margin-top: 4px; }
    @media (max-width: 760px) { header, main { padding-left: 16px; padding-right: 16px; } header { padding-top: 32px; padding-bottom: 22px; } main { padding-bottom: 36px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .meta { padding: 9px; } .type { font-size: 11px; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Pré-visualização temporária · Obra Lisboa</p>
    <h1>30 PUBLICAÇÕES</h1>
    <p class="intro">Grelha Editorial Precision: 10 dias, três publicações por dia — projetos, guias práticos e design de interiores.</p>
    <div class="key"><span>Projetos</span><span>Curiosidade / how-to</span><span>Design de interiores</span></div>
  </header>
  <main><section class="grid" id="grid" aria-label="Grelha de 30 publicações"></section></main>
  <script>
    const posts = [
      ['01-obras-santos-guarda-mor.png','08:15','Projetos'], ['02-guia-antes-de-demolir.png','12:30','Curiosidade / how-to'], ['interior-sala-lisboa-01.png','19:15','Design de interiores'],
      ['04-obras-praca-das-flores.png','08:15','Projetos'], ['05-guia-orçamento-realista.png','12:30','Curiosidade / how-to'], ['interior-cozinha-02.png','19:15','Design de interiores'],
      ['07-obras-campo-pequeno.png','08:15','Projetos'], ['08-guia-licencas.png','12:30','Curiosidade / how-to'], ['interior-quarto-03.png','19:15','Design de interiores'],
      ['10-obras-24-de-julho.png','08:15','Projetos'], ['11-guia-sequencia-de-obra.png','12:30','Curiosidade / how-to'], ['interior-banho-04.png','19:15','Design de interiores'],
      ['13-obras-amoreiras.png','08:15','Projetos'], ['14-guia-humidade.png','12:30','Curiosidade / how-to'], ['interior-sala-jantar-05.png','19:15','Design de interiores'],
      ['16-obras-carnaxide.png','08:15','Projetos'], ['17-guia-eletricidade.png','12:30','Curiosidade / how-to'], ['interior-entrada-06.png','19:15','Design de interiores'],
      ['19-obras-golden-goose.png','08:15','Projetos'], ['20-guia-isolamento.png','12:30','Curiosidade / how-to'], ['interior-escritorio-07.png','19:15','Design de interiores'],
      ['22-obras-graca.png','08:15','Projetos'], ['23-guia-cozinha-planeamento.png','12:30','Curiosidade / how-to'], ['interior-arrumacao-08.png','19:15','Design de interiores'],
      ['25-obras-rua-do-barao.png','08:15','Projetos'], ['26-guia-casa-de-banho.png','12:30','Curiosidade / how-to'], ['interior-leitura-09.png','19:15','Design de interiores'],
      ['28-obras-santos-detalhe.png','08:15','Projetos'], ['29-guia-escolher-equipa.png','12:30','Curiosidade / how-to'], ['interior-carpintaria-10.png','19:15','Design de interiores']
    ];
    document.querySelector('#grid').innerHTML = posts.map((post, index) => `<article><img loading="lazy" src="${post[0]}" alt="Publicação ${index + 1}" /><div class="meta"><div class="number">${String(index + 1).padStart(2,'0')} · ${post[1]}</div><div class="type">${post[2]}</div></div></article>`).join('');
  </script>
</body>
</html>
